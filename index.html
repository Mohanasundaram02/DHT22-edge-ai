<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 DHT22 Edge AI Dashboard</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: sans-serif; background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 320px; text-align: center; }
    .metric { margin: 15px 0; }
    .label { color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; }
    .value { font-size: 2rem; color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>DHT22 Edge AI Monitor</h2>
    <div class="metric">
      <div class="label">Temperature</div>
      <div class="value"><span id="temp">--</span> °C</div>
    </div>
    <div class="metric">
      <div class="label">Humidity</div>
      <div class="value"><span id="hum">--</span> %</div>
    </div>
    <div class="metric">
      <div class="label">AI Confidence / Output</div>
      <div class="value" id="confidence">--</div>
    </div>
  </div>

  <script>
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
    
    client.on('connect', () => {
      // Must match MQTT_TOPIC in ESP32 sketch
      client.subscribe('mohan/edge_ai/dht22_9823'); 
    });

    client.on('message', (topic, message) => {
      const data = JSON.parse(message.toString());
      document.getElementById('temp').innerText = data.temp.toFixed(1);
      document.getElementById('hum').innerText = data.humidity.toFixed(1);
      document.getElementById('confidence').innerText = (data.confidence * 100).toFixed(1) + "%";
    });
  </script>
</body>
</html>
